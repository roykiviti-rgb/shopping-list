<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="קניות">
  <title>רשימת קניות</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading" class="screen center">
    <div class="spinner" aria-hidden="true"></div>
    <p>טוען…</p>
  </div>

  <section id="setup" class="screen center hidden">
    <div class="logo">⚙️</div>
    <h1>צריך להגדיר את Firebase</h1>
    <p>הדביקו את פרטי הפרויקט בקובץ <code>firebase-config.js</code> (ההוראות ב-README).</p>
  </section>

  <section id="login" class="screen center hidden">
    <div class="logo">🛒</div>
    <h1>רשימת הקניות שלנו</h1>
    <p>התחברו עם חשבון Google כדי לראות ולערוך את הרשימה המשותפת.</p>
    <button id="loginBtn" class="btn primary" type="button">התחברות עם Google</button>
    <p id="loginError" class="error"></p>
  </section>

  <section id="denied" class="screen center hidden">
    <div class="logo">🔒</div>
    <h1>אין הרשאה</h1>
    <p>החשבון <b id="deniedEmail"></b> לא מורשה לגשת לרשימה.</p>
    <button id="deniedLogout" class="btn" type="button">התחברות עם חשבון אחר</button>
  </section>

  <section id="app" class="hidden">
    <header class="topbar">
      <select id="listSelect" aria-label="בחירת רשימה"></select>
      <button id="menuBtn" class="icon-btn" type="button" aria-label="תפריט" aria-haspopup="true">⋮</button>
      <div id="menu" class="menu hidden" role="menu">
        <button type="button" data-action="new" role="menuitem">➕ רשימה חדשה</button>
        <button type="button" data-action="rename" role="menuitem">✏️ שינוי שם הרשימה</button>
        <button type="button" data-action="delete" role="menuitem" class="danger">🗑️ מחיקת הרשימה</button>
        <hr>
        <div id="menuUser" class="menu-user"></div>
        <button type="button" data-action="logout" role="menuitem">התנתקות</button>
      </div>
    </header>

    <form id="addForm" class="add-form" autocomplete="off">
      <input id="itemName" list="suggestions" placeholder="מה צריך לקנות?" required maxlength="80" enterkeyhint="done">
      <input id="itemQty" placeholder="כמות" maxlength="20" class="qty-input">
      <button class="btn primary" type="submit" aria-label="הוספה">הוסף</button>
    </form>
    <datalist id="suggestions"></datalist>

    <main>
      <ul id="todoList" class="items"></ul>
      <p id="emptyMsg" class="empty hidden">הרשימה ריקה 🎉</p>

      <div id="doneSection" class="hidden">
        <div class="section-head">
          <h2>בעגלה (<span id="doneCount">0</span>)</h2>
          <button id="clearDone" class="link-btn" type="button">ניקוי</button>
        </div>
        <ul id="doneList" class="items done"></ul>
      </div>
    </main>
  </section>

  <dialog id="editDialog">
    <form method="dialog">
      <h2>עריכת פריט</h2>
      <label>שם<input id="editName" required maxlength="80"></label>
      <label>כמות<input id="editQty" maxlength="20"></label>
      <label>הערה<input id="editNote" maxlength="120" placeholder="למשל: מותג, גודל…"></label>
      <div class="dialog-actions">
        <button value="ok" class="btn primary">שמירה</button>
        <button value="cancel" class="btn" formnovalidate>ביטול</button>
      </div>
    </form>
  </dialog>

  <dialog id="promptDialog">
    <form method="dialog">
      <h2 id="promptTitle"></h2>
      <input id="promptInput" required maxlength="40">
      <div class="dialog-actions">
        <button value="ok" class="btn primary">אישור</button>
        <button value="cancel" class="btn" formnovalidate>ביטול</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirmDialog">
    <form method="dialog">
      <h2 id="confirmTitle"></h2>
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <button value="ok" class="btn danger">כן, למחוק</button>
        <button value="cancel" class="btn">ביטול</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden" role="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
